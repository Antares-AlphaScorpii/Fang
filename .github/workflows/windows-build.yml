name: Build Fang for Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out Fang
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Fang
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Fang --icon icon.png music_organizer_gui.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Fang-Windows-x64
          path: dist/Fang.exe

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload v1.0.0 dist/Fang.exe --clobber
